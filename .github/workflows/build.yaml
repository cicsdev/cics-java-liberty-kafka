name: Build

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * *'

jobs:
  check-copyright:
    runs-on: ubuntu-latest
    name: Check Copyright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: copyright-action
        uses: cicsdev/.github/.github/actions/samples-copyright-checker@4134522d8109169bb8c460db841f94167ec2802f
        with:
          directory: './cics-java-liberty-kafka-app/'
          file-extensions: '*.java'
          base-copyright: 'Copyright IBM Corp. 2026'
          token: ${{ secrets.GITHUB_TOKEN }}

  build-maven:
    name: Build Maven

    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [17, 21, 25]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: "semeru"
          cache: maven
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots --file pom.xml -Djava.version=${{ matrix.jdk }} verify
      - name: Upload WAR artifact
        if: matrix.jdk == 17
        uses: actions/upload-artifact@v4
        with:
          name: cics-java-liberty-kafka-war
          path: cics-java-liberty-kafka-app/target/cics-java-liberty-kafka.war

  build-mvnw:
    name: Build Maven Wrapper

    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [17, 21, 25]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: "semeru"
          cache: maven
      - name: Build with Maven Wrapper
        run: ./mvnw --batch-mode --update-snapshots --file pom.xml -Djava.version=${{ matrix.jdk }} verify

  build-gradle:
    name: Build Gradle
    
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [17, 21, 25]
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.jdk }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.jdk }}
        distribution: 'semeru'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.14.4
    - name: Build with Gradle
      run: gradle clean build -Pjava_version=${{ matrix.jdk }}
  
  build-gradlew:
    name: Build Gradle wrapper
    
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [17, 21, 25]
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.jdk }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.jdk }}
        distribution: 'semeru'
    - name: Build with Gradle Wrapper
      run: ./gradlew clean build -Pjava_version=${{ matrix.jdk }}

  publish-war:
    name: Publish WAR to artifactory
    needs: [build-maven]
    uses: cicsdev/.github/.github/workflows/push-artifactory.yml@79d17c35108e19adfe334a3e5468cc324bd88f5f
    with:
      artifactory-repository: 'Kafka'
      github-artifact-name: 'cics-java-liberty-kafka-war'
      artifactory-artifact-name: 'cics-java-liberty-kafka.war'
    secrets: inherit
