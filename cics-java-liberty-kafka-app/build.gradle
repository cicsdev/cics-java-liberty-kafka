plugins
{
    id 'java'
    id 'eclipse'
    id 'war'
}

group = 'com.ibm.cicsdev'
version = '1.0.0'

war
{
    archiveFileName = 'cics-java-liberty-kafka.war'
}

java
{
    toolchain
    {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
}

// Ensures Gradle Refresh sets the WTP context-root and web facet version correctly.
eclipse
{
    classpath
    {
        downloadJavadoc = true
    }
    wtp
    {
        facet
        {
            facet name: 'jst.web', version: '6.0'
        }
        component
        {
            contextPath = 'cics-java-liberty-kafka'
        }
    }
}

repositories
{
    mavenCentral()
}

dependencies
{
    // CICS TS BOM
    compileOnly enforcedPlatform("com.ibm.cics:com.ibm.cics.ts.bom:${project.property('cics.bom.version')}")

    // Jakarta EE APIs
    compileOnly("jakarta.platform:jakarta.jakartaee-api:${jakartaVersion}")

    // Eclipse MicroProfile
    compileOnly("org.eclipse.microprofile:microprofile:${microprofileVersion}")

    // Liberty developer APIs (WSSubject, WSCallbackHandler, AuthData)
    compileOnly("net.wasdev.maven.tools.targets:liberty-apis:${libertyApisVersion}")

    // JCICS APIs (version managed by BOM)
    compileOnly('com.ibm.cics:com.ibm.cics.server')

    // Apache Kafka client
    // The kafka-clients library depends on slf4j-api.
    // Liberty supplies the logging implementation at runtime, so no additional SLF4J jars are needed.
    implementation "org.apache.kafka:kafka-clients:${kafkaVersion}"
}
